<body>
    <div class="mascara-nossos-servicos"></div>
    <div class="mascara-formulario"></div>
    <div class="header">
        <img src="./assets/logo-header.png" alt="logo-mario">
        <a href="./index.html">Home</a>
        <a href="nossos-servicos.html">Serviços</a>
        <a href="./jogo.html">Experiência</a>

    </div>
    <img src="./assets/background2.jpg" alt="background-2" class="background-2">

    <div class="caixa-mae2">
        <img src="./assets/luigi.png" alt="luigi" class="img-luigi">

        <div class="servicos">
            <h1>Nossos Serviços</h1>
            <br>
            <p>&#x1F527;. Reparo de vazamentos</p>
            <p>&#x1F527;. Desentupimento</p>
            <p>&#x1F527;. Instalações Gerais</p>
            <p>&#x1F527;. Manutenção de Caixas D'Água</p>
            <p>&#x1F527;. Bomba e Pressurizadores</p>
            <p>&#x1F527;. E o mais importante: Salvar Princesas e cogumelos em apuros</p>
            <br>
            <br>
            <button class="button-contact2" onclick="cliqueiNoBotao()">Entre em contato</button>
        </div>

        <form class="formulario-fale-conosco" action="https://formcarry.com/s/NNm38bXdaBA" method="POST"
            enctype="multipart/form-data" onsubmit="return validarFormulario(event)">

            <button type="button" class="btn-fechar-form" onclick="fecharFormulario()">✖</button>

            <input placeholder="Seu nome" type="text" name="name" id="nome" required minlength="3">

            <input placeholder="Seu telefone" type="tel" name="telefone" id="telefone" required
                pattern="[0-9\s\-\(\)]{10,15}" title="Digite um telefone válido">

            <textarea placeholder="Digite seu problema aqui..." name="duvida" id="duvida" required minlength="10"
                rows="4"></textarea>

            <button class="button-form" type="submit">Pedir Orçamento</button>
        </form>
    </div>

     <img src="./assets/cogumelo.png" id="cogumelo" alt="Cogumelo">

    <footer>
        <div class="footer">
            <p>Desenvolvido por <a href="https://caioikegami.github.io/caio-portfolio-react/" target="_blank"
                    rel="noreferrer">Caio Ferreira</a></p>
        </div>
    </footer>

</body>
<script src="./scripts.js"></script>
